services:
  moneyserver:
    image: opensim.server.moneyserver
    stdin_open: true
    tty: true
    stop_grace_period: 60s
    build:
      context: .
      dockerfile: Source/OpenSim.Server.MoneyServer/Dockerfile
      pull: true
      args:
        configuration: Release

  gridserver:
    image: opensim.server.gridserver
    stdin_open: true
    tty: true
    stop_grace_period: 60s
    command: ["${GRID_SERVICE_NAME:-}"]
    build:
      context: .
      dockerfile: Source/OpenSim.Server.GridServer/Dockerfile
      pull: true
      args:
        configuration: Release

  regionserver:
    image: opensim.server.regionserver
    stdin_open: true
    tty: true
    stop_grace_period: 60s
    command: ["${REGION_NAME:-}"]
    build:
      context: .
      dockerfile: Source/OpenSim.Server.RegionServer/Dockerfile
      pull: true
      args:
        configuration: Release
