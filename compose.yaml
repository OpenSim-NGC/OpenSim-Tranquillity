services:
  moneyserver:
    image: opensim.server.moneyserver
    stdin_open: true
    tty: true
    stop_grace_period: 60s
    # GC and thread pool choice at start (Docs/BUILDING.md, "Garbage collector and thread pool"):
    # environment:
    #   DOTNET_gcServer: "0"            # workstation GC: one heap
    #   DOTNET_GCConserveMemory: "5"    # 0 (default) to 9: compact harder
    #   DOTNET_ThreadPool_ForceMinWorkerThreads: "0x40"   # thread pool: at least 64 worker threads (hexadecimal)
    build:
      context: .
      dockerfile: Source/OpenSim.Server.MoneyServer/Dockerfile
      pull: true
      args:
        configuration: Release

  gridserver:
    image: opensim.server.gridserver
    stdin_open: true
    tty: true
    stop_grace_period: 60s
    # GC and thread pool choice at start (Docs/BUILDING.md, "Garbage collector and thread pool"):
    # environment:
    #   DOTNET_gcServer: "0"            # workstation GC: one heap
    #   DOTNET_GCConserveMemory: "5"    # 0 (default) to 9: compact harder
    #   DOTNET_ThreadPool_ForceMinWorkerThreads: "0x40"   # thread pool: at least 64 worker threads (hexadecimal)
    command: ["${GRID_SERVICE_NAME:-}"]
    build:
      context: .
      dockerfile: Source/OpenSim.Server.GridServer/Dockerfile
      pull: true
      args:
        configuration: Release

  regionserver:
    image: opensim.server.regionserver
    stdin_open: true
    tty: true
    stop_grace_period: 60s
    # GC and thread pool choice at start (Docs/BUILDING.md, "Garbage collector and thread pool"):
    # environment:
    #   DOTNET_gcServer: "0"            # workstation GC: one heap
    #   DOTNET_GCConserveMemory: "5"    # 0 (default) to 9: compact harder
    #   DOTNET_ThreadPool_ForceMinWorkerThreads: "0x40"   # thread pool: at least 64 worker threads (hexadecimal)
    command: ["${REGION_NAME:-}"]
    build:
      context: .
      dockerfile: Source/OpenSim.Server.RegionServer/Dockerfile
      pull: true
      args:
        configuration: Release
