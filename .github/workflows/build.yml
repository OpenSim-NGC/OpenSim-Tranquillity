name: Build, Pack, Container & Release

on:
  push:
    branches:
      - master
      - develop
      - 'release/**'
      - 'hotfix/**'
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - develop
      - 'release/**'

permissions:
  contents: write   # Required to create GitHub Releases
  packages: write   # Required to push Docker images to ghcr.io

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set version with Nerdbank.GitVersioning
        id: nbgv
        uses: dotnet/nbgv@master
        with:
          setAllVars: true

      - name: Restore, Build, and Test
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore
          dotnet test --configuration Release --no-build

      - name: Pack NuGet packages
        if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')
        run: dotnet pack --configuration Release --no-build --output ./artifacts

      - name: Publish to NuGet.org
        if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://nuget.org \
            --skip-duplicate

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.nbgv.outputs.SemVer2 }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(steps.nbgv.outputs.NuGetPackageVersion, '-') }}

      - name: Build and push Docker image
        if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.nbgv.outputs.NuGetPackageVersion }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.nbgv.outputs.NuGetPackageVersion, '-') }}
          files: ./artifacts/*.nupkg

