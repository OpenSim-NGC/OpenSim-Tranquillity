name: dotnet console app build

on:
  push:
    branches:
      - develop
      - master
      - 'release/*'

  pull_request:
    branches: 
      - develop
      - 'release/*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4 
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Activate Nerdbank.GitVersioning
      uses: dotnet/nbgv@v0.4.1
      id: nbgv # Instantiates environment arrays (e.g., \$NBGV_NuGetPackageVersion)

    - name: Restore dependencies
      env:
        GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      run: dotnet restore ./Tranquillity.sln

    - name: Build
      env:
        GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      run: dotnet build ./Tranquillity.sln --configuration Release --no-restore

