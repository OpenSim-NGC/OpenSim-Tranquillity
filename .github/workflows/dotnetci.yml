name: dotnet console app build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4 # Checkout the repository
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Specify the desired .NET SDK version

    - name: Display dotnet version
      run: dotnet --version

    - name: Restore dependencies
      run: dotnet restore ./Tranquillity.sln

    - name: Build
      run: dotnet build ./Tranquillity.sln --configuration Release

#    - name: Tests
#      run: dotnet test ./Tranquillity.sln --verbosity normal

    - name: Publish for Linux x64
      run: dotnet publish Tranquillity.sln -c Release -r linux-x64 --self-contained false -o ./publish

    - name: Publish for Windows x64
      run: dotnet publish Tranquillity.sln -c Release -r win-x64 --self-contained false -o ./publish