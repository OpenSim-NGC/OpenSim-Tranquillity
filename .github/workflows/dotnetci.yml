name: dotnet console app build

on:
  push:
    branches:
      - develop
      - master
      - 'release/*'

  pull_request:
    branches: 
      - develop
      - 'release/*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4 
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Activate Nerdbank.GitVersioning
      uses: dotnet/nbgv@v0.4.1
      id: nbgv # Instantiates environment arrays (e.g., \$NBGV_NuGetPackageVersion)

    - name: Restore dependencies
      env:
        GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      run: dotnet restore ./Tranquillity.sln

    - name: Build
      env:
        GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      run: dotnet build ./Tranquillity.sln --configuration Release --no-restore

    # Every test project in the solution runs. The job fails on a test that fails and is not in
    # Tests/known-failures.txt, or on a test project that produced no results (a crashed test host);
    # known failures that pass are listed so the file can be trimmed. See Tests/README-CI.md.
    - name: Test
      continue-on-error: true
      run: >
        dotnet test ./Tranquillity.sln --configuration Release --no-build
        --logger "trx;LogFilePrefix=results" --results-directory TestResults
        --blame-hang --blame-hang-timeout 15m

    - name: Compare with known failures
      run: python3 tools/check-test-results.py TestResults Tests/known-failures.txt Tranquillity.sln

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: TestResults
        retention-days: 14

