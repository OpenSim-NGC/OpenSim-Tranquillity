version: 1.0.0.{build}
branches:
  only:
  - develop
image: Visual Studio 2022
environment:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
install:
- ps: |
    Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile "$env:TEMP\dotnet-install.ps1"
    & "$env:TEMP\dotnet-install.ps1" -Channel 10.0 -InstallDir "$env:ProgramFiles\dotnet"
- dotnet --list-sdks
- git submodule update --init --recursive
- dotnet restore
build: off
build_script:
- dotnet build Tranquillity.sln -c Debug --no-restore
artifacts:
- path: Source\OpenSim.Server.RegionServer\bin\Debug\net10.0
  name: NGC-Tranquillity-RegionServer
- path: Source\OpenSim.Server.GridServer\bin\Debug\net10.0
  name: NGC-Tranquillity-Robust
